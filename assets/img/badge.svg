<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <!-- Clean Concept 1 Fanned Cards Silhouette for Android Status Bar Badge -->
  <g transform="translate(48, 48) scale(0.24)">
    <!-- Back Card -->
    <g transform="rotate(-24) translate(-25, -12)">
      <rect x="-95" y="-130" width="190" height="260" rx="36" fill="#ffffff" opacity="0.55"/>
    </g>
    <!-- Middle Card -->
    <g transform="rotate(-6) translate(-6, -6)">
      <rect x="-95" y="-130" width="190" height="260" rx="36" fill="#ffffff" opacity="0.75"/>
    </g>
    <!-- Front Card -->
    <g transform="rotate(14) translate(18, 8)">
      <rect x="-95" y="-130" width="190" height="260" rx="36" fill="#ffffff"/>
      <circle cx="0" cy="-80" r="15" fill="#000000" opacity="0.3"/>
      <rect x="-55" y="-15" width="110" height="12" rx="6" fill="#000000" opacity="0.3"/>
      <rect x="-55" y="18" width="85" height="12" rx="6" fill="#000000" opacity="0.3"/>
    </g>
  </g>
</svg>