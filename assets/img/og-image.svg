<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <!-- Google 2026 AI Gradient -->
    <linearGradient id="ogHeroGrad" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#b8caff"/>
      <stop offset="20%" stop-color="#82a6ff"/>
      <stop offset="50%" stop-color="#3b82f7"/>
      <stop offset="82%" stop-color="#1d61e8"/>
      <stop offset="100%" stop-color="#1042b5"/>
    </linearGradient>
    <linearGradient id="ogRearGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2565ec"/>
      <stop offset="100%" stop-color="#0e3a9c"/>
    </linearGradient>
    <linearGradient id="ogMidGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#4e8aff"/>
      <stop offset="100%" stop-color="#184ec6"/>
    </linearGradient>

    <filter id="ogCardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b1"/>
      <feOffset in="b1" dx="0" dy="18" result="o1"/>
      <feFlood flood-color="#071b40" flood-opacity="0.22" result="c1"/>
      <feComposite in="c1" in2="o1" operator="in" result="s1"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b2"/>
      <feOffset in="b2" dx="-2" dy="6" result="o2"/>
      <feFlood flood-color="#071b40" flood-opacity="0.18" result="c2"/>
      <feComposite in="c2" in2="o2" operator="in" result="s2"/>

      <feMerge>
        <feMergeNode in="s1"/>
        <feMergeNode in="s2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ogLayerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="-2" dy="5" result="off"/>
      <feFlood flood-color="#06163a" flood-opacity="0.25" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="shad"/>
      <feMerge>
        <feMergeNode in="shad"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="627" fill="url(#ogBg)"/>

  <!-- Subtle ambient decorative circles -->
  <circle cx="1050" cy="120" r="280" fill="#3b82f7" opacity="0.06"/>
  <circle cx="150" cy="520" r="220" fill="#7c3aed" opacity="0.04"/>

  <!-- LEFT: Large Fanned Study Deck Hero Graphic -->
  <g transform="translate(310, 314) scale(1.15)" filter="url(#ogCardShadow)">
    <!-- Back Card -->
    <g transform="rotate(-24) translate(-30, -15)">
      <rect x="-115" y="-155" width="230" height="310" rx="44" fill="url(#ogRearGrad)"/>
      <circle cx="0" cy="-95" r="16" fill="#ffffff" opacity="0.30"/>
    </g>

    <!-- Middle Card -->
    <g transform="rotate(-6) translate(-8, -8)" filter="url(#ogLayerShadow)">
      <rect x="-115" y="-155" width="230" height="310" rx="44" fill="url(#ogMidGrad)"/>
      <circle cx="0" cy="-95" r="16" fill="#ffffff" opacity="0.45"/>
    </g>

    <!-- Front Hero Card -->
    <g transform="rotate(14) translate(22, 10)" filter="url(#ogLayerShadow)">
      <rect x="-115" y="-155" width="230" height="310" rx="44" fill="url(#ogHeroGrad)"/>
      <circle cx="0" cy="-95" r="18" fill="#ffffff"/>
      <rect x="-65" y="-18" width="130" height="14" rx="7" fill="#ffffff" opacity="0.95"/>
      <rect x="-65" y="22" width="100" height="14" rx="7" fill="#ffffff" opacity="0.95"/>
      <rect x="-65" y="62" width="60" height="14" rx="7" fill="#ffffff" opacity="0.95"/>
    </g>
  </g>

  <!-- RIGHT: Typographic Branding & Value Proposition -->
  <g transform="translate(620, 180)">
    <!-- M3 Category Pill -->
    <rect x="0" y="0" width="230" height="40" rx="20" fill="#dbeafe"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1e40af">
      ESTUDO INTELIGENTE
    </text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" fill="#0f172a" letter-spacing="-1.5">
      Flashcards
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#475569">
      Repetição espaçada com inteligência artificial.
    </text>
    <text x="0" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#64748b">
      Aprenda mais rápido, memorize para sempre.
    </text>

    <!-- Feature Chips (Material 3 style) -->
    <g transform="translate(0, 260)">
      <!-- Chip 1: PWA Offline -->
      <rect x="0" y="0" width="140" height="42" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1e293b">
        PWA Offline
      </text>

      <!-- Chip 2: Gemini AI -->
      <rect x="156" y="0" width="145" height="42" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="176" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1e293b">
        Gemini AI
      </text>

      <!-- Chip 3: Custo Zero -->
      <rect x="317" y="0" width="135" height="42" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="337" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1e293b">
        100% Grátis
      </text>
    </g>
  </g>
</svg>